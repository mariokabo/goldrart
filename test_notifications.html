<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اختبار الإشعارات - Test Notifications</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 500px;
            width: 100%;
        }
        h1 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 28px;
        }
        p {
            color: #666;
            margin-bottom: 30px;
        }
        .status {
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-weight: bold;
        }
        .status.connected {
            background: #d4edda;
            color: #155724;
            border: 2px solid #c3e6cb;
        }
        .status.disconnected {
            background: #f8d7da;
            color: #721c24;
            border: 2px solid #f5c6cb;
        }
        input {
            width: 100%;
            padding: 15px;
            margin-bottom: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        input:focus {
            outline: none;
            border-color: #667eea;
        }
        button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-bottom: 10px;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        button:active {
            transform: translateY(0);
        }
        .btn-secondary {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }
        .log {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            max-height: 200px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 12px;
        }
        .log-entry {
            padding: 5px 0;
            border-bottom: 1px solid #e0e0e0;
        }
        .log-entry:last-child {
            border-bottom: none;
        }
        .success { color: #28a745; }
        .error { color: #dc3545; }
        .info { color: #17a2b8; }
        .inline-icon { width: 18px; height: 18px; display: inline-block; vertical-align: -3px; margin-left: 6px; }
    </style>
</head>
<body>
    <div class="container">
        <h1><img class="inline-icon" src="/assets/icons/png/bell.png" alt="Notifications">اختبار الإشعارات</h1>
        <p>Test Android Notifications</p>
        
        <div id="status" class="status disconnected">
            غير متصل بالتطبيق | Not Connected
        </div>

        <input type="text" id="titleInput" placeholder="عنوان الإشعار | Notification Title" value="مرحباً">
        <input type="text" id="messageInput" placeholder="نص الإشعار | Notification Message" value="هذا اختبار للإشعارات">
        
        <button onclick="testNotification()"><img class="inline-icon" src="/assets/icons/png/send.png" alt="Send">إرسال إشعار | Send Notification</button>
        <button class="btn-secondary" onclick="testMultiple()"><img class="inline-icon" src="/assets/icons/png/send.png" alt="Send">إرسال 3 إشعارات تجريبية</button>
        <button class="btn-secondary" onclick="clearLog()"><img class="inline-icon" src="/assets/icons/png/delete.png" alt="Clear">مسح السجل | Clear Log</button>

        <div class="log" id="log">
            <div class="log-entry info">سجل الإشعارات | Notification Log</div>
        </div>
    </div>

    <script>
        // Check Android Bridge
        function checkAndroidBridge() {
            const isConnected = typeof AndroidNotif !== 'undefined' && 
                                AndroidNotif && 
                                typeof AndroidNotif.send === 'function';
            
            const statusDiv = document.getElementById('status');
            if (isConnected) {
                statusDiv.className = 'status connected';
                statusDiv.innerHTML = 'متصل بالتطبيق | Connected to App';
                addLog('success', 'Android Bridge متصل بنجاح');
            } else {
                statusDiv.className = 'status disconnected';
                statusDiv.innerHTML = 'غير متصل بالتطبيق | Not Connected (Open in Android App)';
                addLog('error', 'AndroidNotif غير موجود - افتح الصفحة في التطبيق');
            }
            return isConnected;
        }

        // Send notification
        function testNotification() {
            const title = document.getElementById('titleInput').value.trim() || 'إشعار تجريبي';
            const message = document.getElementById('messageInput').value.trim() || 'رسالة اختبار';
            
            if (typeof AndroidNotif !== 'undefined' && AndroidNotif && typeof AndroidNotif.send === 'function') {
                try {
                    AndroidNotif.send(title, message);
                    addLog('success', `تم إرسال: ${title} - ${message}`);
                } catch(e) {
                    addLog('error', `خطأ: ${e.message}`);
                }
            } else {
                addLog('error', 'التطبيق غير متصل - افتح هذه الصفحة في تطبيق الأندرويد');
                alert('يجب فتح هذه الصفحة في التطبيق لإرسال الإشعارات!');
            }
        }

        // Send multiple test notifications
        function testMultiple() {
            const tests = [
                { title: 'ترحيب', message: 'مرحباً بك في التطبيق!' },
                { title: 'عرض خاص', message: 'خصم 20% على جميع المنتجات' },
                { title: 'تذكير', message: 'لديك طلب جديد بانتظار المراجعة' }
            ];

            if (typeof AndroidNotif !== 'undefined' && AndroidNotif && typeof AndroidNotif.send === 'function') {
                tests.forEach((test, index) => {
                    setTimeout(() => {
                        try {
                            AndroidNotif.send(test.title, test.message);
                            addLog('success', `[${index + 1}] ${test.title}: ${test.message}`);
                        } catch(e) {
                            addLog('error', `[${index + 1}] خطأ: ${e.message}`);
                        }
                    }, index * 1000);
                });
            } else {
                addLog('error', 'التطبيق غير متصل');
                alert('يجب فتح هذه الصفحة في التطبيق!');
            }
        }

        // Add log entry
        function addLog(type, message) {
            const logDiv = document.getElementById('log');
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            const time = new Date().toLocaleTimeString('ar-EG');
            entry.textContent = `[${time}] ${message}`;
            logDiv.appendChild(entry);
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        // Clear log
        function clearLog() {
            const logDiv = document.getElementById('log');
            logDiv.innerHTML = '<div class="log-entry info">سجل الإشعارات | Notification Log</div>';
            addLog('info', 'تم مسح السجل');
        }

        // Check on load
        window.addEventListener('load', () => {
            checkAndroidBridge();
            addLog('info', 'الصفحة جاهزة للاختبار');
        });

        // Re-check every 2 seconds
        setInterval(checkAndroidBridge, 2000);
    </script>
</body>
</html>
